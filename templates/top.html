<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NEONFLIX • Top Rated</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body data-page="top">
  <header class="nav">
    <div class="brand">
      <div class="dot"></div>
      <div class="name">NEONFLIX</div>
      <div class="sub">Standout page • Top Rated movies</div>
    </div>

    <div class="nav-actions">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="/top">Top Rated</a>
      <a class="nav-link" href="/skipped">Skipped</a>
      <a class="nav-link" href="/watchlist">Watchlist</a>

      <button id="watchlistBtn" class="nav-pill">
        Drawer <span id="watchlistCount" class="count">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="top-hero card">
      <div>
        <h1>Top Rated</h1>
        <p class="muted">A standout page: browse the highest-rated English movies and open previews instantly.</p>
      </div>

      <div class="top-controls">
        <div class="row">
          <div class="field">
            <label class="label">Search (English only)</label>
            <input id="searchBox" class="input" placeholder="Try: Interstellar, Fight Club, Joker..." />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label class="label">Year from</label>
            <input id="yearFrom" class="input" placeholder="1990" />
          </div>
          <div class="field">
            <label class="label">Year to</label>
            <input id="yearTo" class="input" placeholder="2024" />
          </div>

          <button id="loadTopBtn" class="btn primary">Load</button>
          <button id="nextTopBtn" class="btn">Next page</button>
        </div>

        <div id="topMeta" class="muted small">Press “Load” to fetch top rated.</div>
      </div>
    </section>

    <section class="grid card">
      <div id="topGrid" class="movie-grid"></div>
    </section>
  </main>

  <!-- WATCHLIST DRAWER -->
  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div class="section-title">Watchlist</div>
        <button id="drawerClose" class="btn">Close</button>
      </div>
      <div id="watchlistItems" class="watchlist"></div>
    </div>
  </div>

  <!-- PREVIEW MODAL -->
  <div id="modal" class="modal hidden">
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div id="modalTitle" class="modal-title">—</div>
          <div id="modalMeta" class="muted small">—</div>
        </div>
        <button id="modalClose" class="btn">Close</button>
      </div>

      <div class="modal-body">
        <div class="modal-left">
          <img id="modalPoster" class="poster" alt="poster" />
          <div class="badges">
            <span id="modalLangBadge" class="badge">EN</span>
          </div>

          <div class="where-to-watch">
            <div class="section-title">Where to watch</div>
            <div id="providersRow" class="providers-row muted">Loading…</div>
          </div>
        </div>

        <div class="modal-right">
          <div class="section-title">Synopsis</div>
          <div id="modalOverview" class="muted">—</div>

          <div class="spacer"></div>
          <div class="section-title">Trailer</div>
          <div class="trailer">
            <iframe id="trailerFrame" title="Trailer" allowfullscreen></iframe>
            <div id="noTrailer" class="muted hidden">No trailer found.</div>
          </div>

          <div class="modal-actions">
            <button id="modalSkip" class="btn">Back</button>
            <button id="modalLike" class="btn primary">Add to watchlist</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
